<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags & SEO -->
    <title>Lume – Blog Editorial Minimalista &amp; Galeria Multimédia</title>
    <meta name="title" content="Lume – Blog Editorial Minimalista &amp; Galeria Multimédia" />
    <meta name="description" content="Plataforma editorial sobre tecnologia, foco e desenvolvimento pessoal com galeria fotográfica e publicações multimédia em tempo real." />
    <meta name="keywords" content="blog, tecnologia, foco, hábitos, minimalismo, fotografia, galeria, artigos reflexivos, desenvolvimento pessoal, Lume" />
    <meta name="author" content="Lume Editorial" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical Link -->
    <link rel="canonical" href="https://lume.pt/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lume" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:title" content="Lume – Blog Editorial Minimalista &amp; Galeria Multimédia" />
    <meta property="og:description" content="Plataforma editorial sobre tecnologia, foco e desenvolvimento pessoal com galeria fotográfica e publicações multimédia em tempo real." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lume - Blog e Galeria Editorial" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lume – Blog Editorial Minimalista &amp; Galeria Multimédia" />
    <meta name="twitter:description" content="Plataforma editorial sobre tecnologia, foco e desenvolvimento pessoal com galeria fotográfica e publicações multimédia em tempo real." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" />

    <!-- Typography & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Google Identity Services (GIS) for Google Sign-In & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Schema.org Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "/#website",
          "url": "/",
          "name": "Lume",
          "description": "Blog pessoal e galeria integrada de fotos com publicações editoriais e multimédia.",
          "inLanguage": "pt-PT",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "/#organization",
          "name": "Lume Editorial",
          "url": "/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80"
          }
        },
        {
          "@type": "Blog",
          "@id": "/#blog",
          "name": "Lume – Publicações & Ensaios",
          "description": "Artigos sobre hábitos intencionais, tecnologia moderna e cultura visual minimalista.",
          "publisher": {
            "@id": "/#organization"
          },
          "inLanguage": "pt-PT"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#F8F7FC] text-slate-800 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
